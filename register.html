<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account</title>
  <link rel="stylesheet" href="/src/register.css" />
</head>
<body>

  <div class="page-wrapper">
    <div class="bg-grid"></div>

    <div class="main-container">

      <!-- LEFT SIDE -->
      <div class="left-side">
        <div class="left-overlay"></div>
        <div class="left-corner-icon">
          <div class="icon-box"></div>
        </div>

        <div class="left-top">
          <div class="brand-row">
            <div class="brand-icon"></div>
            <span class="brand-name">NEXUS</span>
          </div>
        </div>

        <div class="left-bottom">
          <div class="left-heading">Enter the Neural Grid</div>
          <p class="left-desc">Initialize your neural link to gain access to the simulation network and begin your mission.</p>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="right-side">

        <div class="form-header">
          <div class="form-title">Create Your Operador Profile</div>
          <div class="form-subtitle">Initialize your neural link to begin the simulation.</div>
        </div>

        <div class="form-fields">

          <!-- Username -->
          <div class="field-group">
            <div class="field-label">
              <div class="label-dot"></div>
              <span class="label-text">Username</span>
            </div>
            <input class="field-input" type="text" placeholder="Enter unique identifier" />
          </div>

          <!-- Email -->
          <div class="field-group">
            <div class="field-label">
              <div class="label-dot"></div>
              <span class="label-text">Email Address</span>
            </div>
            <input class="field-input" type="email" placeholder="name@network.com" />
          </div>

          <!-- Password -->
          <div class="field-group" style="padding-bottom: 16px;">
            <div class="field-label">
              <div class="label-dot"></div>
              <span class="label-text">Access Code</span>
            </div>
            <div class="password-wrapper">
              <input class="field-input" type="password" id="passwordInput" placeholder="Secure access sequence" />
              <button class="toggle-password" onclick="togglePassword()" title="Toggle visibility">
                <div class="eye-icon"></div>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button class="submit-btn">
            <span>Initialize Neural Link</span>
            <div class="arrow-icon"></div>
          </button>

        </div>

        <!-- Footer -->
        <div class="footer-links">
          <div class="footer-text-row">
            <span class="footer-text">Already have an account?</span>
            <a href="#" class="footer-link">Login to Station</a>
          </div>
          <div class="social-row">
            <div class="social-icon si-discord"></div>
            <div class="social-icon si-twitter"></div>
            <div class="social-icon si-github"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
